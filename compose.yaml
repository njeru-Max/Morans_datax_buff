services:
  postgres:
    image: postgres:16-alpine
    container_name: nelsen-platform-postgres
    environment:
      POSTGRES_DB: data_platform
      POSTGRES_USER: platform
      POSTGRES_PASSWORD: platform_dev_password
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - platform_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U platform -d data_platform"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  platform_postgres_data:
